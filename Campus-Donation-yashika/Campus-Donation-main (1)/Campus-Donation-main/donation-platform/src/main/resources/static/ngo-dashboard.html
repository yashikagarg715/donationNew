<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGO Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f7f7f7; }
        .card { background-color: white; padding: 1.5rem; border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .result { padding: 10px; margin-top: 15px; border-radius: 8px; font-weight: 500; }
        .success { background-color: #d1fae5; color: #065f46; border: 1px solid #34d399; }
        .error { background-color: #fee2e2; color: #991b1b; border: 1px solid #f87171; }
        .list-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #e5e7eb; padding: 12px 0; }
        .list-item:last-child { border-bottom: none; }
        .btn-success { background-color: #10b981; color: white; padding: 8px 12px; border-radius: 8px; font-size: 0.875rem; transition: background-color 0.15s; }
        .btn-success:hover { background-color: #059669; }
    </style>
</head>
<body>
<!-- Header -->
<header class="bg-teal-600 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-white">NGO Dashboard</h1>
        <button onclick="logout()"
                class="bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded-lg transition duration-150">
            Logout
        </button>
    </div>
</header>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <h2 class="text-3xl font-extrabold text-gray-900 mb-6">Manage Your Initiatives</h2>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

        <!-- 1. Create Campaign Form (Financial Goal) -->
        <div class="lg:col-span-1 card h-fit">
            <h3 class="text-2xl font-bold text-teal-700 mb-4 border-b pb-2">List a Campaign</h3>
            <form id="campaignForm" class="space-y-4">
                <div>
                    <label for="campaignTitle" class="block text-sm font-medium text-gray-700">Campaign Title</label>
                    <input type="text" id="campaignTitle" name="campaignTitle" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-teal-500 focus:border-teal-500">
                </div>
                <div>
                    <label for="campaignDescription" class="block text-sm font-medium text-gray-700">Campaign Description</label>
                    <textarea id="campaignDescription" name="campaignDescription" rows="3" required
                              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-teal-500 focus:border-teal-500"></textarea>
                </div>
                <div>
                    <label for="campaignGoal" class="block text-sm font-medium text-gray-700">Goal Amount (e.g., 10000)</label>
                    <input type="number" id="campaignGoal" name="campaignGoal" required min="1" step="any"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-teal-500 focus:border-teal-500">
                </div>
                <button type="submit"
                        class="w-full bg-teal-600 text-white py-2 rounded-lg font-semibold hover:bg-teal-700 transition">
                    Create Campaign
                </button>
            </form>
            <div id="campaignResult"></div>
            <h4 class="text-xl font-semibold text-teal-700 mt-6 border-t pt-4">My Campaigns</h4>
            <div id="myCampaignsList" class="space-y-2 max-h-56 overflow-y-auto mt-2">
                <p class="text-center text-gray-500">Loading your campaigns...</p>
            </div>
        </div>

        <!-- 2. Available Donations List (for requesting items) -->
        <div class="lg:col-span-2 card">
            <h3 class="text-2xl font-bold text-teal-700 mb-4 border-b pb-2">Available Donations (Request Items)</h3>
            <div id="availableDonationsList" class="space-y-2 max-h-96 overflow-y-auto">
                <p class="text-center text-gray-500">Loading available donations...</p>
            </div>
        </div>
    </div>
</main>

<script src="script.js"></script>
</body>
</html>

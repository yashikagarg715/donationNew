<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Campus Donation Platform</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Subtle blue gradient background */
            background: linear-gradient(135deg, #e0f2fe 0%, #bfdbfe 100%);
        }
        /* Custom styles for result messages to match script.js logic */
        .success { background-color: #d1fae5; color: #065f46; border: 1px solid #34d399; }
        .error { background-color: #fee2e2; color: #991b1b; border: 1px solid #f87171; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
<div class="max-w-md w-full bg-white p-8 rounded-xl shadow-2xl border border-gray-100 transition duration-300 hover:shadow-3xl">
    <h1 class="text-4xl font-extrabold text-center text-indigo-700 mb-2">Welcome Back</h1>
    <p class="text-center text-gray-500 mb-8">Sign in to manage your donations or initiatives.</p>

    <form id="loginForm" class="space-y-6">
        <div>
            <label for="loginEmail" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
            <input type="email" id="loginEmail" name="loginEmail" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 shadow-sm"
                   placeholder="you@example.com">
        </div>

        <div>
            <label for="loginPassword" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" id="loginPassword" name="loginPassword" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 shadow-sm"
                   placeholder="••••••••">
        </div>

        <button type="submit"
                class="w-full bg-indigo-600 text-white py-3 rounded-xl font-semibold text-lg hover:bg-indigo-700 transition shadow-lg shadow-indigo-200">
            Log In
        </button>
    </form>

    <!-- Message area for login result (used by script.js) -->
    <div id="loginResult" class="mt-6"></div>

    <p class="mt-6 text-center text-sm text-gray-600">
        Don't have an account?
        <a href="register.html" class="font-medium text-indigo-600 hover:text-indigo-500 underline transition duration-150">Register Here</a>
    </p>
</div>
<script src="script.js"></script>
</body>
</html>

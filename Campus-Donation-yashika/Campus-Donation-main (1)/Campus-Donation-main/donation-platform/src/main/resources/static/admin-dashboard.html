<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Campus Donation Platform</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f7f7;
        }

        .card {
            background-color: white;
            padding: 1.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

<!-- Header / Navigation Bar -->
<header class="bg-indigo-600 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-white">Campus Donation Admin Panel</h1>
        <div class="flex items-center space-x-4">

            <button onclick="logout()"
                    class="bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded-lg transition duration-150">
                Logout
            </button>
        </div>
    </div>
</header>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <h2 class="text-3xl font-extrabold text-gray-900 mb-6">Administrator Dashboard</h2>

    <!-- Dashboard Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- Card 2: Available Donations (For NGO to Request) -->
        <!-- This section shows ALL available donations, fulfilling your new request. -->
        <div class="lg:col-span-1 card">
            <h3 class="text-2xl font-bold text-green-700 mb-4 border-b pb-2">
                Total Available Donations
            </h3>
            <!-- Container for fetchAvailableDonationsForAdmin() -->
            <div id="availableDonationsContainer" class="space-y-2 max-h-96 overflow-y-auto">
                <p class="text-center text-gray-500">Loading...</p>
            </div>
        </div>

        <!-- Card 1: Pending Donation Requests (NGO Requests) -->
        <!-- This section shows NGOs who want those items. -->
        <div class="lg:col-span-2 card">
            <h3 class="text-2xl font-bold text-indigo-700 mb-4 border-b pb-2">
                Pending Donation Requests (NGO Approvals)
            </h3>
            <!-- Container for fetchPendingRequests() -->
            <div id="pendingRequestsContainer" class="space-y-4 max-h-96 overflow-y-auto">
                <p class="text-center text-gray-500">Loading...</p>
            </div>
        </div>

        <!-- Card 3: Processed Donation History (Full Audit Trail) -->
        <div class="lg:col-span-3 card mt-6">
            <h3 class="text-2xl font-bold text-indigo-700 mb-4 border-b pb-2">
                Processed Donation History (Approved/Rejected)
            </h3>
            <!-- Container for fetchDonationHistory() -->
            <div id="donationHistoryContainer" class="divide-y divide-gray-100">
                <p class="text-center text-gray-500">Loading...</p>
            </div>
        </div>

    </div>
</main>

<!-- Load the Admin JavaScript -->
<script src="admin-script.js?v=4"></script>

</body>

</html>

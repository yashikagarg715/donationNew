<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Registration - Campus Donation Platform</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Consistent background with login.html */
            background: linear-gradient(135deg, #e0f2fe 0%, #bfdbfe 100%);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

<div class="max-w-md w-full bg-white p-8 rounded-xl shadow-2xl border border-gray-100 transition duration-300 hover:shadow-3xl">
    <h1 class="text-4xl font-extrabold text-center text-teal-700 mb-2">User Registration</h1>
    <p class="text-center text-gray-500 mb-8">Join as a Donor, NGO, or Administrator.</p>

    <form id="registerForm" class="space-y-6">
        <div>
            <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
            <input type="text" id="username" name="username" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-teal-500 focus:border-teal-500 transition duration-150 shadow-sm"
                   placeholder="Enter your name or organization name">
        </div>

        <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" id="email" name="email" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-teal-500 focus:border-teal-500 transition duration-150 shadow-sm"
                   placeholder="you@example.com">
        </div>

        <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" id="password" name="password" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-teal-500 focus:border-teal-500 transition duration-150 shadow-sm"
                   placeholder="••••••••">
        </div>

        <div>
            <label for="role" class="block text-sm font-medium text-gray-700 mb-1">Select Role</label>
            <select id="role" name="role" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-teal-500 focus:border-teal-500 transition duration-150 shadow-sm bg-white cursor-pointer">
                <option value="" disabled selected>Select Role</option>
                <option value="DONOR">DONOR</option>
                <option value="NGO">NGO</option>
                <!-- ADMIN role included for testing/setup purposes -->
                <option value="ADMIN">ADMIN</option>
            </select>
        </div>

        <button type="submit"
                class="w-full bg-teal-600 text-white py-3 rounded-xl font-semibold text-lg hover:bg-teal-700 transition shadow-lg shadow-teal-200">
            Register
        </button>
    </form>

    <!-- Message area for registration result (used by script.js) -->
    <div id="registerResult" class="mt-6"></div>

    <p class="mt-6 text-center text-sm text-gray-600">
        Already have an account?
        <a href="login.html" class="font-medium text-indigo-600 hover:text-indigo-500 underline transition duration-150">Log In</a>
    </p>
</div>

<script src="script.js"></script>
<script>
    // Pre-select role from URL query parameter (e.g., ?role=DONOR)
    window.addEventListener('load', function() {
        const urlParams = new URLSearchParams(window.location.search);
        const role = urlParams.get('role');
        // Check if the role is a valid option before attempting to set it
        if (role) {
            const roleSelect = document.getElementById('role');
            const optionExists = Array.from(roleSelect.options).some(option => option.value === role.toUpperCase());
            if (optionExists) {
                 roleSelect.value = role.toUpperCase();
            }
        }
    });
</script>

</body>
</html>

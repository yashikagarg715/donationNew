# Database connection settings
spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/donation_db
spring.datasource.username=postgres
spring.datasource.password=2306
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=update
# 'update' will create/update tables based on entities (safe for development; use 'validate' in production)
spring.jpa.show-sql=true
# No need for explicit dialect - Hibernate auto-detects PostgreSQL

# Server port
server.port=8080

# Enable CORS for frontend development (allows requests from local HTML files or dev servers)
spring.web.cors.enabled=true
spring.web.cors.allowed-origins=http://localhost:63342,http://127.0.0.1:5500,http://localhost:3000,file:///*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Logging (optional: increase verbosity for debugging)
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE



# Spring Security (disable CSRF for AJAX dev; enable in prod)
spring.security.user.name= # Not needed (using custom UserDetailsService)

# Enhanced Logging for Testing/Debug
logging.level.org.springframework.security=DEBUG

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
# JPA for Testing (shows SQL for criteria demo)
spring.jpa.properties.hibernate.format_sql=true